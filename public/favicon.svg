<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="stjudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#stjudeGrad)" filter="url(#glow)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Medical Heraldic Shield / Caduceus Cross Motif -->
  <path d="M32 10 L48 18 C48 34 38 48 32 52 C26 48 16 34 16 18 Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Inner St. Jude Clinical Cross -->
  <path d="M28 22 H36 V29 H43 V37 H36 V44 H28 V37 H21 V29 H28 Z" fill="url(#stjudeGrad)"/>
  
  <!-- Heart of Compassion Dot in Center -->
  <circle cx="32" cy="33" r="3.2" fill="url(#goldGrad)"/>
  <circle cx="32" cy="33" r="1.5" fill="#ffffff"/>
</svg>
