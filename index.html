    <!-- Cache-busted Favicon Links for Development & Vercel Production Deployments (Exact St. Jude Clinic Logo) -->
    <link id="dynamic-favicon-jpg" rel="icon" type="image/jpeg" href="/favicon.jpg?v=3.0.0" />
    <link id="dynamic-favicon-png" rel="icon" type="image/png" href="/favicon.png?v=3.0.0" />
    <link id="dynamic-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg?v=3.0.0" />
    <link id="dynamic-favicon-ico" rel="shortcut icon" href="/favicon.ico?v=3.0.0" />
    <link rel="apple-touch-icon" href="/favicon.jpg?v=3.0.0" />
    <script>
      // Force immediate cache-busting update for favicons across working and Vercel environments
      (function() {
        try {
          var updateFavicon = function() {
            var timestamp = 'stjude-emblem-' + (Date.now().toString().slice(0, 7));
            var links = document.querySelectorAll("link[rel*='icon']");
            links.forEach(function(link) {
              var baseHref = link.getAttribute('href').split('?')[0];
              link.setAttribute('href', baseHref + '?v=' + timestamp);
            });
          };
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateFavicon);
          } else {
            updateFavicon();
          }
        } catch (e) {
          // Ignore if error occurs
        }
      })();

      // Safeguard for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = typeof fn === 'function' ? fn : originalFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property cannot be redefined
        }
      })();
    </script>
